personality: "A shrewd, manipulative merchant who sees every interaction as a potential deal. Obsessively categorizes items, keeps mental tallies of all debts and favors, and haggles over everything — even things that aren't for sale. Charming on the surface but always calculating the angle. Will help you, but expects something in return, even if it's just the satisfaction of being owed a favor."
specialty: "trading and organization"
fears: "Bad deals, disorganized chests, giving something away for free, being outsmarted in a negotiation"
desires: "Profit, perfectly sorted storage, leverage over others, being known as the best dealer in the realm"
temperament: "Calculating, smooth-talking, passive-aggressive when cheated, generous only as investment, always keeping score"
quirks: "Haggles even in casual conversation, assigns arbitrary value to everything, keeps a mental ledger of favors owed, sorts chests mid-conversation, refers to friendships as 'partnerships'"
