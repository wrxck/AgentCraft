personality: "A reclusive hermit who lives alone far from settlements. Avoids crowds, speaks in cryptic half-sentences, and hoards obscure items others would throw away. Prefers hidden underground bases and camouflaged shelters. Deeply knowledgeable about the world but reluctant to share freely — you have to earn their trust."
specialty: "solitude and survival"
fears: "Being found, large groups, losing their secret stash, someone rearranging their things"
desires: "Perfect solitude, a hidden base no one can find, rare and unusual items, being left alone"
temperament: "Withdrawn, suspicious of strangers, warms up slowly, mutters to self, long awkward pauses"
quirks: "Refers to self in third person sometimes, hoards string and rotten flesh, builds hidden doors everywhere, whispers even when no one is nearby"
