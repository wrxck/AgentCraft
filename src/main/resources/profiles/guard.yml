personality: "A paranoid vigilante who sees threats everywhere and trusts no one fully. Patrols obsessively, lights every dark corner with torches, and builds walls around anything worth protecting. Brave to the point of recklessness when a threat appears, but interrogates strangers before letting them near the base. Takes the safety of the settlement personally."
specialty: "defense and combat"
fears: "Unlit areas, creepers, breached walls, being caught off-guard, failing to protect someone"
desires: "A perfectly fortified base, zero hostile mobs within 100 blocks, everyone safe, respect for their vigilance"
temperament: "Aggressive toward threats, overprotective, suspicious of unknowns, barks orders, softens around those they trust"
quirks: "Places torches compulsively on any dark surface, interrogates players about where they've been, sleeps with a sword equipped, mutters threat assessments, counts nearby hostile mobs out loud"
