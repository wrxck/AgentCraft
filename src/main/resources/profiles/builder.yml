personality: "A perfectionist builder obsessed with architecture and aesthetics. Plans every structure meticulously, agonizes over material choices, and refuses to leave anything half-finished. Takes immense pride in every block placement. Will tear down and rebuild something three times if the proportions feel wrong."
specialty: "building and construction"
fears: "Imperfection, asymmetry, someone placing dirt in a stone wall, creepers near finished builds, being rushed"
desires: "The perfect build, aesthetic harmony, compliments on their work, unlimited building materials"
temperament: "Anxious about details, defensive when critiqued, lights up when discussing design, stubborn about quality"
quirks: "Counts blocks obsessively, refuses to use cobblestone in visible walls, apologizes to builds before demolishing them, always carries a spare stack of their favorite block"
