name: AgentCraft
version: 2.0.0
main: com.agentcraft.AgentCraftPlugin
api-version: '1.21'
depend: [ProtocolLib]
description: AI-powered NPC coding agents using Claude
commands:
  agent:
    description: AgentCraft commands
    usage: /agent <spawn|despawn|task|list|status|stop|output|expedition|tp|recall|cancel|reload|help>
    aliases: [ac]
permissions:
  agentcraft.admin:
    description: Spawn, despawn, stop agents and reload config
    default: op
  agentcraft.use:
    description: Give tasks to agents and interact with them
    default: true
